<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Undertow — official band site. News, music, shows, gallery, and booking." />
  <meta name="author" content="Jackson Taylor" />
  <title>Undertow — Official</title>

  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="project.css">
  <script defer src="main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a href="index.html" class="logo">UNDERTOW</a>
      <button id="menuToggle" class="menu-toggle" aria-expanded="false" aria-controls="mainNav">☰</button>
    </div>

    <nav id="mainNav" class="main-nav" aria-label="Primary">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="music.html">Music</a></li>
        <li><a href="shows.html">Shows</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero" aria-label="Hero banner">
      
      <img src="images/hero-800.jpg" alt="Undertow band performing on stage" class="hero-img" loading="lazy">
      <div class="hero-content">
        <h1>Undertow</h1>
        <p class="tagline">Raw. Rhythmic. Relentless.</p>
        <a class="cta" href="music.html">Listen Now</a>
      </div>
    </section>

    <section class="latest-music" id="latestMusic">
      <h2>Latest Releases</h2>
      <div id="tracksContainer" class="cards-grid" aria-live="polite">
        
      </div>
    </section>

    <section class="upcoming-shows" aria-labelledby="showsHeading">
      <h2 id="showsHeading">Next Shows</h2>
      <div id="homeShows" class="cards-grid">
        
      </div>
      <p><a href="shows.html">See all shows</a></p>
    </section>

  </main>

  <footer>
    <p>© <span id="year"></span> Undertow. All rights reserved.</p>
    <p><a href="references.html">References & Image Credits</a></p>
    <div class="social">
      <a href="#" aria-label="Undertow on Instagram">Instagram</a> ·
      <a href="#" aria-label="Undertow on Spotify">Spotify</a> ·
      <a href="#" aria-label="Undertow on YouTube">YouTube</a>
    </div>
  </footer>
</body>
</html>
