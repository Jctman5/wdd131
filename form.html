<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Review Form</title>
<link rel="stylesheet" href="styles/form.css" />
</head>
<body>
<header>
<h1>Product Review Form</h1>
</header>


<main>
<form method="get" action="review.html" id="reviewForm">

<label for="product">Product Name</label>
<select id="product" name="product" required>
<option value="" disabled selected>Select a Product ...</option>
</select>



<fieldset>
<legend>Overall Rating</legend>
<label><input type="radio" name="rating" value="1" required /> ☆</label>
<label><input type="radio" name="rating" value="2" required /> ☆☆</label>
<label><input type="radio" name="rating" value="3" required /> ☆☆☆</label>
<label><input type="radio" name="rating" value="4" required /> ☆☆☆☆</label>
<label><input type="radio" name="rating" value="5" required /> ☆☆☆☆☆</label>
</fieldset>



<label for="installDate">Date of Installation</label>
<input type="date" id="installDate" name="installDate" required />



<fieldset>
<legend>Useful Features (check all that apply)</legend>
<label><input type="checkbox" id="feature1" name="features" value="durability" /> Durability</label>
<label><input type="checkbox" id="feature2" name="features" value="design" /> Design</label>
<label><input type="checkbox" id="feature3" name="features" value="performance" /> Performance</label>
<label><input type="checkbox" id="feature4" name="features" value="price" /> Price</label>
</fieldset>


<label for="reviewText">Written Review</label>
<textarea id="reviewText" name="reviewText" rows="5"></textarea>



<label for="username">Your Name (optional)</label>
<input type="text" id="username" name="username" />


<input type="submit" value="Submit Review" />
</form>
</main>


<footer>
<p>&copy; 2025 | Product Review Assignment</p>
</footer>


<script src="scripts/products.js"></script>
</body>
</html>
