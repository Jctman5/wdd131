<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive album showcasing temple images with navigation and dynamic content.">
  <meta name="author" content="Jackson Taylor">
  <title>Temple Album</title>

 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  
  <link rel="stylesheet" href="styles/filtered-temples.css">
  <link rel="stylesheet" href="styles/filtered-temples-large.css">

 
  <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
  <header>
    <div class="header-title">Temple Album</div>
    <button id="hamburger">&#9776;</button>

    <nav id="nav">
      <a href="#">Home</a>
      <a href="#">Old</a>
      <a href="#">New</a>
      <a href="#">Large</a>
      <a href="#">Small</a>
    </nav>
  </header>

  <main>
    <h1>Home</h1>
    <section id="filters">
      <button data-filter="all">All</button>
      <button data-filter="old">Old Temples</button>
      <button data-filter="new">New Temples</button>
      <button data-filter="large">Large Temples</button>
      <button data-filter="small">Small Temples</button>
    </section>
    <section class="gallery" id="temple-container">

    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> | Jackson Taylor | United States</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
